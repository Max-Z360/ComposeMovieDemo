<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tipmi — launch film (variant b)</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <canvas id="bg" class="full" width="1920" height="1080"></canvas>
  <canvas id="hook" class="full" width="1920" height="1080"></canvas>
  <div id="world" class="layer"></div>
  <div id="type" class="layer"></div>
  <div id="bandOv" class="abs"></div>
  <div id="vignette" class="layer"></div>
  <canvas id="grain" class="full" width="1920" height="1080"></canvas>
  <div id="black" class="layer" style="display:none"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../src/cues.js"></script>
<script src="constants.js"></script>
<script src="gen/util.js"></script>
<script src="gen/stilllife.js"></script>
<script src="gen/cards.js"></script>
<script src="gen/grain.js"></script>
<script src="gen/light.js"></script>
<script src="gen/wall.js"></script>
<script src="gen/wordmark.js"></script>
<script src="scenes/type.js"></script>
<script src="scenes/carrier.js"></script>
<script src="scenes/feed.js"></script>
<script src="scenes/studio.js"></script>
<script src="scenes/ledger.js"></script>
<script src="scenes/logo.js"></script>
<script>
(function () {
  const TB = window.TB;
  gsap.ticker.lagSmoothing(0);
  gsap.globalTimeline.pause();
  if (LANG === 'zh') document.body.classList.add('zh');

  const FONT_SPECS = [
    '400 84px Fraunces', 'italic 400 84px Fraunces', '500 176px Fraunces', '600 44px Fraunces', '500 28px Fraunces',
    'italic 400 300px Fraunces', '500 22px Inter', '500 21px Inter', '500 16px Inter', '500 14px Inter', '400 22px Inter',
  ].concat(LANG === 'zh' ? ['400 84px "Noto Sans SC"', '500 22px "Noto Sans SC"'] : []);

  const SCENES = [TB.sceneType, TB.sceneCarrier, TB.sceneFeed, TB.sceneStudio, TB.sceneLedger, TB.sceneLogo].filter(Boolean);
  const S = (window.S = {});
  let tl = null;
  const bg = document.getElementById('bg').getContext('2d');
  const hook = document.getElementById('hook');
  const hookCtx = hook.getContext('2d');
  const grain = document.getElementById('grain');
  const grainCtx = grain.getContext('2d');
  const vig = document.getElementById('vignette');
  const bandOv = document.getElementById('bandOv');
  const black = document.getElementById('black');
  const INK_END = CUES.shots.turn[0];          // 8.571 hard cut ink -> paper
  const FREEZE = CUES.mute[0];                 // 7.857
  const PIC_END = CUES.pictureEnd;             // 42.0

  window.DURATION = CUES.duration;             // 42.5 (planner override; picture 0–42.0 then black)

  window.seek = function (t) {
    tl.seek(t, false);
    const ink = t < INK_END;
    TB.drawField(bg, S.F, t, ink);
    // hook canvas
    if (ink) { hook.style.display = 'block'; TB.drawHook(hookCtx, t, S); }
    else hook.style.display = 'none';
    for (const sc of SCENES) sc.update(t, S);
    // window light over plates/type (soft-light), paper only
    const B = TB.band(t);
    if (!ink && B.a > 0.001) {
      bandOv.style.display = 'block';
      bandOv.style.opacity = (0.2 * B.a).toFixed(4);
      bandOv.style.transform = `translate(${(B.x - 420).toFixed(1)}px, -260px) rotate(-8deg)`;
    } else bandOv.style.display = 'none';
    // film grade overlays
    vig.className = 'layer ' + (ink ? 'vig-ink' : 'vig-paper');
    const gi = Math.floor(Math.min(t, t >= FREEZE && t < INK_END ? FREEZE : t) * 24);
    TB.drawGrain(grainCtx, S.G, gi);
    grain.style.opacity = ink ? '0.05' : '0.04';
    black.style.display = t >= PIC_END - 1e-6 ? 'block' : 'none';
  };

  window.READY = (async () => {
    await Promise.all(FONT_SPECS.map((f) => document.fonts.load(f)));
    await document.fonts.ready;
    S.lib = TB.buildLibrary(SEED + 1);
    S.G = TB.buildGrain(SEED + 2);
    S.F = TB.buildFields(TB.buildTooth(SEED + 6));
    S.wall = TB.buildWall();
    tl = gsap.timeline({ paused: true });
    for (const sc of SCENES) sc.build(S, tl);
    // prime: render every tween once to the end and back so all proxies are initialised deterministically
    tl.seek(DURATION, false); tl.seek(0, false);
    window.seek(0);
  })();
})();
</script>
</body></html>
