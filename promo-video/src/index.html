<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>pipeline stub</title>
<link rel="stylesheet" href="fonts.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b0b0d;color:#f3efe6}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
canvas{position:absolute;inset:0}
.line{position:absolute;left:160px;top:440px;font:600 120px/1 "Fraunces";letter-spacing:-0.02em;opacity:0}
.sub{position:absolute;left:164px;top:590px;font:400 36px/1.3 "Inter";letter-spacing:0.08em;text-transform:uppercase;opacity:0;color:#b9b2a3}
.zh{position:absolute;right:160px;bottom:120px;font:300 40px/1 "Noto Sans SC";opacity:0}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<div class="line" id="l1">Pipeline test — Fraunces</div>
<div class="sub" id="l2">Inter · deterministic frames</div>
<div class="zh" id="l3">中文字体测试</div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
// seeded PRNG (mulberry32)
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7); const blobs=Array.from({length:6},()=>({x:R()*1920,y:R()*1080,r:300+R()*400,h:200+R()*80,s:0.2+R()*0.5,p:R()*6.28}));
const ctx=document.getElementById('bg').getContext('2d');
function drawBg(t){ctx.fillStyle='#0b0b0d';ctx.fillRect(0,0,1920,1080);ctx.globalCompositeOperation='lighter';
 for(const b of blobs){const x=b.x+Math.sin(t*b.s+b.p)*120,y=b.y+Math.cos(t*b.s*0.8+b.p)*90;const g=ctx.createRadialGradient(x,y,0,x,y,b.r);g.addColorStop(0,`hsla(${b.h},70%,55%,0.35)`);g.addColorStop(1,'hsla(0,0%,0%,0)');ctx.fillStyle=g;ctx.fillRect(x-b.r,y-b.r,b.r*2,b.r*2)}
 ctx.globalCompositeOperation='source-over'}
gsap.ticker.lagSmoothing(0);
const tl=gsap.timeline({paused:true});
tl.fromTo('#l1',{opacity:0,y:40,filter:'blur(12px)'},{opacity:1,y:0,filter:'blur(0px)',duration:1.2,ease:'expo.out'},0.4)
  .fromTo('#l2',{opacity:0,y:20},{opacity:1,y:0,duration:1,ease:'expo.out'},0.9)
  .fromTo('#l3',{opacity:0},{opacity:1,duration:1},1.4)
  .to('#stage',{opacity:0,duration:0.8},3.2);
window.DURATION=4;
window.seek=function(t){tl.seek(t,false);drawBg(t)};
window.READY=document.fonts.ready.then(()=>{window.seek(0)});
</script></body></html>
