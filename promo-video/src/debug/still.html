<!doctype html>
<html><head><meta charset="utf-8"><title>still life test</title>
<style>body{margin:0;background:#222;color:#ccc;font:14px sans-serif}canvas{display:inline-block;margin:8px;vertical-align:top}</style></head>
<body><div id="out"></div>
<script src="../gen/util.js"></script>
<script src="../gen/stilllife.js"></script>
<script>
const L = TB.linRGB;
const P = {
  seed: 7, ss: 1.5, sunSamples: 12, aoSamples: 8, aoDist: 0.8, exposure: 1.0,
  cam: { pos: [0, 1.2, -9], target: [0, 0.62, 0.4], fov: 15 },
  sun: { dir: [-0.85, 0.40, -0.30], rad: 0.035, col: [1.0, 0.80, 0.58], k: 3.2 },
  win: { x: -2.6, panes: [[0.75, 2.5, -2.2, -0.05], [0.75, 2.5, 0.07, 1.25]] },
  amb: { col: [0.30, 0.36, 0.40], k: 0.55 },
  wall: { z: 2.0, col: L('#C4A88E'), fall: 0.5 },
  table: { col: L('#9C8670'), edge: -1.0, front: L('#3a2e26') },
  objects: [
    { kind: 'bottle', x: -0.32, z: 0.35, r: 0.2, h: 1.32, color: L('#DCD0BC'), spec: 0.10, gloss: 30 },
    { kind: 'jar', x: 0.34, z: 0.15, r: 0.30, h: 0.58, color: L('#8E4C36'), spec: 0.08, gloss: 20 },
    { kind: 'cup', x: 0.02, z: -0.42, r: 0.13, h: 0.24, color: L('#4A5558'), spec: 0.12, gloss: 40 },
  ],
};
window.READY = (async () => {
  const t0 = performance.now();
  const c = TB.renderStillLife(P, 540, 720);
  const P2 = JSON.parse(JSON.stringify(P)); P2.win.panes=[[0.6, 3.2, -2.6, 1.7]]; P2.sun.dir=[-0.8,0.32,-0.2];
  const c2 = TB.renderStillLife(P2, 540, 720); document.getElementById('out').appendChild(c2);
  const t1 = performance.now();
  document.getElementById('out').appendChild(c);
  const info = document.createElement('div'); info.textContent = 'render ' + Math.round(t1 - t0) + ' ms';
  document.body.appendChild(info);
  console.log('render ms', Math.round(t1 - t0));
})();
</script></body></html>
